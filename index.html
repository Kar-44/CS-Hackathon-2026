<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusCycle - Student Marketplace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <i class="fas fa-bicycle"></i> CampusCycle
            </a>

            <div class="nav-links">
                <a href="favorites.html" class="nav-item" title="Favorites"><i class="far fa-heart"></i></a>
                <a href="chats.html" class="nav-item" title="Chats"><i class="far fa-comment-dots"></i></a>
                <a href="account.html" class="nav-item" title="My Account"><i class="far fa-user-circle"></i></a>
                <a href="add-offer.html" class="nav-item btn-add-offer"><i class="fas fa-plus"></i> Add Offer</a>
            </div>
        </nav>
    </header>

    <section class="hero">
        <h1>Find what you need on campus.</h1>
        <br>
        <div class="search-container">
            <input type="text" class="search-input" id="searchInput"
                placeholder="Search for textbooks, furniture, electronics...">
            <button class="search-btn" onclick="applySearch()"><i class="fas fa-search"></i></button>
        </div>
    </section>

    <div class="container">

        <aside>
            <div class="category-list">
                <h3>Categories</h3>
                <ul>
                    <li onclick="setCategory(this, '')" class="active-category"><i class="fas fa-th-list"></i> All
                        Categories</li>
                    <li onclick="setCategory(this, 'Textbooks')"><i class="fas fa-book"></i> Textbooks</li>
                    <li onclick="setCategory(this, 'Electronics')"><i class="fas fa-laptop"></i> Electronics</li>
                    <li onclick="setCategory(this, 'Dorm Furniture')"><i class="fas fa-couch"></i> Dorm Furniture</li>
                    <li onclick="setCategory(this, 'Transport')"><i class="fas fa-bicycle"></i> Transport</li>
                    <li onclick="setCategory(this, 'Clothing')"><i class="fas fa-tshirt"></i> Clothing</li>
                    <li onclick="setCategory(this, 'Events')"><i class="fas fa-ticket-alt"></i> Events</li>
                </ul>
            </div>
        </aside>

        <div class="offers-feed" id="offersFeed">


        </div>
    </div>

    <script src="api.js"></script>
    <script src="login.db"></script>
    <script src="offers.db"></script>
    <script>
        // --- GLOBAL HELPERS ---
        function getCurrent() { return API.getCurrentUser(); }
        function saveCurrent(user) { API.setCurrentUser(user); }

        async function startChat(offerId) {
            const user = getCurrent();
            if (!user) {
                alert("Please login to send messages.");
                window.location.href = 'account.html';
                return;
            }

            const offers = window.OffersDB.getOffers();
            const offer = offers.find(o => o.id == offerId);
            if (!offer) return;

            if (offer.sellerUsername === user.username) {
                alert("You cannot message yourself.");
                return;
            }

            try {
                // Get seller avatar from cached users
                let sellerAvatar = '';
                const users = window.LoginDB.getUsers();
                if (offer.sellerUsername) {
                    const sellerObj = users.find(u => u.username === offer.sellerUsername);
                    if (sellerObj && sellerObj.profile && sellerObj.profile.avatar) {
                        sellerAvatar = sellerObj.profile.avatar;
                    }
                }

                const result = await API.createChat({
                    offerId: String(offerId),
                    sellerUsername: offer.sellerUsername || 'Unknown',
                    sellerName: offer.seller || 'Unknown',
                    sellerAvatar: sellerAvatar,
                    offerTitle: offer.title,
                    offerImage: offer.image
                });

                if (result.success) {
                    window.location.href = `chats.html?chatId=${result.chatId}`;
                }
            } catch (e) {
                alert('Failed to start chat. Please try again.');
            }
        }

        let currentCategory = '';
        let currentSearch = '';

        // --- FILTER AND RENDER OFFERS ---
        function renderOffers() {
            const storedOffers = window.OffersDB.getOffers();
            const users = window.LoginDB.getUsers();
            const currentUser = getCurrent();
            const feed = document.getElementById('offersFeed');
            feed.innerHTML = '';

            let filteredOffers = storedOffers;

            if (currentCategory) {
                filteredOffers = filteredOffers.filter(o => o.category === currentCategory);
            }

            if (currentSearch) {
                const term = currentSearch.toLowerCase();
                filteredOffers = filteredOffers.filter(o =>
                    (o.title && o.title.toLowerCase().includes(term)) ||
                    (o.desc && o.desc.toLowerCase().includes(term))
                );
            }

            if (filteredOffers.length === 0) {
                feed.innerHTML = '<p style="text-align:center; color:#666; margin-top:20px; width: 100%;">No offers found matching your criteria.</p>';
                return;
            }

            filteredOffers.forEach(offer => {

                let sellerName = offer.seller || "Unknown";
                let avatarHtml = `<div class="seller-avatar">${sellerName.substring(0, 2).toUpperCase()}</div>`;

                if (offer.sellerUsername) {
                    const sellerObj = users.find(u => u.username === offer.sellerUsername);
                    if (sellerObj) {
                        sellerName = sellerObj.profile.name || sellerObj.username;
                        if (sellerObj.profile.avatar && sellerObj.profile.avatar.length > 50) {
                            avatarHtml = `<img src="${sellerObj.profile.avatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">`;
                        }
                    }
                }

                let isLiked = false;
                if (currentUser && currentUser.favorites && currentUser.favorites.includes(offer.id)) {
                    isLiked = true;
                }
                const likeClass = isLiked ? 'liked' : '';

                const html = `
                    <div class="offer-card" id="card-${offer.id}">
                        <button class="heart-btn ${likeClass}" onclick="toggleLike(this, ${offer.id})">
                            <i class="fas fa-heart"></i>
                        </button>
                        <div class="card-image">
                            <img src="${offer.image}" alt="${offer.title}">
                        </div>
                        <div class="card-details">
                            <div class="card-header">
                                <div class="offer-title">${offer.title}</div>
                                <div class="offer-price">€${offer.price}</div>
                            </div>
                            <p class="offer-desc">${offer.desc}</p>
                            <div class="card-footer">
                                <div class="seller-info">
                                    ${avatarHtml}
                                    <span style="margin-left:8px;">${sellerName} • ${offer.time}</span>
                                </div>
                                <button class="contact-btn" onclick="startChat('${offer.id}')">Message</button>
                            </div>
                        </div>
                    </div>
                `;
                feed.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- FILTER HELPERS ---
        function setCategory(element, category) {
            document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active-category'));
            element.classList.add('active-category');

            currentCategory = category;
            renderOffers();
        }

        function applySearch() {
            currentSearch = document.getElementById('searchInput').value.trim();
            renderOffers();
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                applySearch();
            }
        });

        // Initialize: load data from server then render
        window.onload = async function () {
            try {
                await window.OffersDB.refreshOffers();
                await window.LoginDB.refreshUsers();
            } catch (e) {
                console.error('Failed to load data', e);
            }
            renderOffers();
        };

        // --- TOGGLE LIKE FUNCTION ---
        async function toggleLike(btn, id) {
            let user = getCurrent();

            if (!user) {
                alert("Please login to save favorites.");
                window.location.href = 'account.html';
                return;
            }

            if (!user.favorites) user.favorites = [];

            const index = user.favorites.indexOf(id);

            try {
                if (index === -1) {
                    await API.addFavorite(id);
                    btn.classList.add('liked');
                } else {
                    await API.removeFavorite(id);
                    btn.classList.remove('liked');
                }
            } catch (e) {
                alert('Failed to update favorites.');
            }
        }
    </script>
</body>

</html>
