        .heart-btn {

        .heart-btn:hover {
            transform: scale(1.1);

        .heart-btn.liked {
            color: var(--heart-color);

        /* Price alert styles */
        .price-drop-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;

        }
        
        .alert-details {
            margin-top: 15px;
            padding: 10px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }
        
        .alert-status {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .refresh-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            margin-left: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Modal styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;

    <script>
        // Theme management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('campuscycle_theme', theme);
            
            const toggle = document.getElementById('themeToggle');
            if (toggle) {
                const icon = toggle.querySelector('i');
                const text = toggle.querySelector('span');
                
                if (theme === 'dark') {
                    icon.className = 'fas fa-sun';
                    text.textContent = 'Light Mode';
                } else {
                    icon.className = 'fas fa-moon';
                    text.textContent = 'Dark Mode';
                }
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('campuscycle_theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                setTheme(prefersDark ? 'dark' : 'light');
            }
        }

        // Mobile menu toggle
        function toggleMobileMenu() {
            document.querySelector('.nav-links').classList.toggle('show');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const nav = document.querySelector('.nav-links');
            const toggle = document.querySelector('.mobile-menu-toggle');
            
            if (nav && toggle && !nav.contains(event.target) && !toggle.contains(event.target)) {
                nav.classList.remove('show');
            }
        });

        // Close mobile menu when clicking a link
        document.querySelectorAll('.nav-item').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelector('.nav-links').classList.remove('show');
            });
        });

        // --- HELPERS ---
        function getCurrent() { return JSON.parse(localStorage.getItem('currentUser')); }
        function saveCurrent(user) { localStorage.setItem('currentUser', JSON.stringify(user)); }
        function getUsers() { return JSON.parse(localStorage.getItem('campusUsers')) || []; }
        function saveUsers(users) { localStorage.setItem('campusUsers', JSON.stringify(users)); }
        function getOffers() { return JSON.parse(localStorage.getItem('campusOffers')) || []; }

        // Recently Viewed functions
        const RECENT_VIEWS_KEY = 'recentlyViewed';
        const MAX_RECENT_ITEMS = 20;

        function getRecentlyViewed() {
            return JSON.parse(localStorage.getItem(RECENT_VIEWS_KEY)) || [];
        }

        function addToRecentlyViewed(offerId) {
            let recent = getRecentlyViewed();
            recent = recent.filter(id => id !== offerId);
            recent.unshift(offerId);
            if (recent.length > MAX_RECENT_ITEMS) {
                recent = recent.slice(0, MAX_RECENT_ITEMS);
            }
            localStorage.setItem(RECENT_VIEWS_KEY, JSON.stringify(recent));
        }

        function clearRecentlyViewed() {
            localStorage.removeItem(RECENT_VIEWS_KEY);
            if (currentTab === 'recent') {
                loadRecentlyViewed();
            }
        }

        // --- SHOW ERROR FUNCTION ---
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            document.getElementById('errorModal').style.display = 'flex';
            
            setTimeout(() => {
                document.getElementById('errorModal').style.display = 'none';
            }, 3000);
        }

        // --- SHOW NOTIFICATION ---
        function showNotification(title, message, type = 'info', onClick = null) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            
            const colors = {
                success: '#4CAF50',
                error: '#ff4757',
                warning: '#ff9800',
                info: '#2196F3'
            };
            
            notification.style.background = colors[type] || colors.info;
            notification.style.color = 'white';
            notification.style.padding = '15px 20px';
            notification.style.borderRadius = '8px';
            notification.style.marginBottom = '10px';
            notification.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
            notification.style.animation = 'slideIn 0.3s ease';
            notification.style.cursor = onClick ? 'pointer' : 'default';
            
            notification.innerHTML = `
                <div style="display: flex; align-items: center; gap: 10px;">
                    <i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-bell'}" style="font-size: 1.5rem;"></i>
                    <div>
                        <strong>${title}</strong>
                        <div style="font-size: 0.9rem; margin-top: 3px;">${message}</div>
                    </div>
                </div>
            `;
            
            if (onClick) {
                notification.onclick = onClick;
            }
            
            container.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 8000);
        }

        // --- TAB SWITCHING ---
        let currentTab = 'favorites';
        let autoRefreshInterval = null;

        function switchTab(tab, element) {
            document.querySelectorAll('.category-list li').forEach(li => {
                li.classList.remove('active');
            });
            element.classList.add('active');
            
            currentTab = tab;
            loadTabContent();
            
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
            
            if (tab === 'priceAlerts') {
                autoRefreshInterval = setInterval(checkForPriceDrops, 30000);
            }
        }

        // --- LOAD TAB CONTENT ---
        function loadTabContent() {
            switch(currentTab) {
                case 'favorites':
                    loadFavorites();
                    break;
                case 'recent':
                    loadRecentlyViewed();
                    break;
                case 'priceAlerts':
                    loadPriceAlerts();
                    break;
                default:
                    loadFavorites();
            }
        }

        // --- LOAD FAVORITES ---
        function loadFavorites() {
            const user = getCurrent();
            const feed = document.getElementById('favFeed');
            
            if (!user) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-heart"></i>
                        <h3>Please Login</h3>
                        <p>You need to be logged in to see your favorites.</p>
                        <a href="account.php">Go to Login</a>
                    </div>`;
                return;
            }

            feed.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading your favorites...</p>
                </div>`;

            fetch('api/get-user-favorites.php')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        user.favorites = data.favorites;
                        localStorage.setItem('currentUser', JSON.stringify(user));
                        return fetch('get-offers.php');
                    } else {
                        throw new Error(data.message || 'Failed to load favorites');
                    }
                })
                .then(response => response.json())
                .then(data => {
                    const allOffers = data.offers || [];
                    displayFavorites(allOffers, user);
                })
                .catch(error => {
                    console.error('Error:', error);
                    const allOffers = getOffers();
                    displayFavorites(allOffers, user);
                });
        }

        function displayFavorites(allOffers, user) {
            const feed = document.getElementById('favFeed');
            const myFavs = allOffers.filter(offer => user.favorites.includes(offer.id));

            if (myFavs.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="far fa-heart"></i>
                        <p>You haven't liked any offers yet.</p>
                        <a href="index.php">Browse Offers</a>
                    </div>`;
                return;
            }

            feed.innerHTML = '';
            myFavs.forEach(offer => {
                const card = createOfferCard(offer, true);
                feed.appendChild(card);
            });
        }

        // --- LOAD RECENTLY VIEWED ---
        function loadRecentlyViewed() {
            const user = getCurrent();
            const feed = document.getElementById('favFeed');
            
            if (!user) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <h3>Please Login</h3>
                        <p>Login to see your recently viewed items.</p>
                        <a href="account.php">Go to Login</a>
                    </div>`;
                return;
            }

            feed.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading recently viewed...</p>
                </div>`;

            const recentIds = getRecentlyViewed();
            
            if (recentIds.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <p>No recently viewed items.</p>
                        <a href="index.php">Browse Offers</a>
                    </div>`;
                return;
            }

            fetch('get-offers.php')
                .then(response => response.json())
                .then(data => {
                    const allOffers = data.offers || [];
                    displayRecentlyViewed(allOffers, recentIds, user);
                })
                .catch(error => {
                    console.error('Error:', error);
                    const allOffers = getOffers();
                    displayRecentlyViewed(allOffers, recentIds, user);
                });
        }

        function displayRecentlyViewed(allOffers, recentIds, user) {
            const feed = document.getElementById('favFeed');
            
            const recentOffers = allOffers
                .filter(offer => recentIds.includes(offer.id))
                .sort((a, b) => {
                    return recentIds.indexOf(a.id) - recentIds.indexOf(b.id);
                });

            if (recentOffers.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-history"></i>
                        <p>No recently viewed items found.</p>
                        <a href="index.php">Browse Offers</a>
                    </div>`;
                return;
            }

            feed.innerHTML = '';

            const headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.justifyContent = 'space-between';
            headerDiv.style.alignItems = 'center';
            headerDiv.style.marginBottom = '20px';
            headerDiv.style.padding = '0 10px';
            
            headerDiv.innerHTML = `
                <h3 style="color: var(--primary);">Recently Viewed</h3>
                <button onclick="clearRecentlyViewed()" style="padding: 5px 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer; color: var(--text-light, #666);">
                    <i class="fas fa-trash"></i> Clear History
                </button>
            `;
            feed.appendChild(headerDiv);

            recentOffers.forEach(offer => {
                const isFavorited = user && user.favorites ? user.favorites.includes(offer.id) : false;
                const card = createOfferCard(offer, isFavorited);
                feed.appendChild(card);
            });
        }

        // --- PRICE ALERTS FUNCTIONS ---
        let priceAlerts = [];
        let triggeredAlertIds = new Set();

        function checkForPriceDrops() {
            const user = getCurrent();
            if (!user || currentTab !== 'priceAlerts') return;

            fetch('api/check-price-alerts-manual.php')
                .then(response => response.json())
                .then(data => {
                    if (data.triggered && data.triggered.length > 0) {
                        data.triggered.forEach(alert => {
                            if (!triggeredAlertIds.has(alert.id)) {
                                triggeredAlertIds.add(alert.id);
                                showNotification(
                                    '🔥 Price Drop Alert!',
                                    `${alert.offerTitle} is now €${alert.currentPrice}`,
                                    'success',
                                    () => {
                                        if (currentTab !== 'priceAlerts') {
                                            document.getElementById('tabPriceAlerts').click();
                                        }
                                    }
                                );
                                document.getElementById('alertBadge').style.display = 'inline';
                            }
                        });
                        
                        if (currentTab === 'priceAlerts') {
                            loadPriceAlerts();
                        }
                    }
                })
                .catch(error => console.error('Error checking price drops:', error));
        }

        function loadPriceAlerts() {
            const user = getCurrent();
            const feed = document.getElementById('favFeed');
            
            if (!user) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bell"></i>
                        <h3>Please Login</h3>
                        <p>Login to manage your price alerts.</p>
                        <a href="account.php">Go to Login</a>
                    </div>`;
                return;
            }

            feed.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading price alerts...</p>
                </div>`;

            fetch('api/check-price-alerts-manual.php')
                .then(response => response.json())
                .then(data => {
                    if (data.triggered && data.triggered.length > 0) {
                        data.triggered.forEach(alert => {
                            triggeredAlertIds.add(alert.id);
                            showNotification(
                                '🔥 Price Drop Alert!',
                                `${alert.offerTitle} is now €${alert.currentPrice}`,
                                'success',
                                () => {
                                    if (currentTab !== 'priceAlerts') {
                                        document.getElementById('tabPriceAlerts').click();
                                    }
                                }
                            );
                        });
                        document.getElementById('alertBadge').style.display = 'inline';
                    }
                    
                    return fetch('api/price-alerts.php');
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        priceAlerts = data.alerts;
                        const hasTriggered = priceAlerts.some(a => a.is_notified == 1);
                        document.getElementById('alertBadge').style.display = hasTriggered ? 'inline' : 'none';
                        displayPriceAlerts(priceAlerts);
                    } else {
                        throw new Error(data.message || 'Failed to load alerts');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    feed.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <p>Failed to load price alerts.</p>
                            <button onclick="loadPriceAlerts()" style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">Try Again</button>
                        </div>`;
                });
        }

        function displayPriceAlerts(alerts) {
            const feed = document.getElementById('favFeed');
            
            if (!alerts || alerts.length === 0) {
                feed.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bell"></i>
                        <h3>No Price Alerts</h3>
                        <p>Set price alerts on items you're watching!</p>
                        <a href="index.php">Browse Offers</a>
                    </div>`;
                return;
            }

            feed.innerHTML = '';

            const headerDiv = document.createElement('div');
            headerDiv.style.display = 'flex';
            headerDiv.style.justifyContent = 'space-between';
            headerDiv.style.alignItems = 'center';
            headerDiv.style.marginBottom = '20px';
            headerDiv.style.padding = '0 10px';
            
            headerDiv.innerHTML = `
                <h3 style="color: var(--primary);">
                    Your Price Alerts
                    <span class="refresh-indicator" title="Auto-refreshes every 30 seconds"></span>
                </h3>
                <button onclick="clearAllAlerts()" style="padding: 5px 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer; color: var(--text-light, #666);">
                    <i class="fas fa-trash"></i> Clear All
                </button>
            `;
            feed.appendChild(headerDiv);

            alerts.sort((a, b) => {
                if (a.is_notified && !b.is_notified) return -1;
                if (!a.is_notified && b.is_notified) return 1;
                return new Date(b.created) - new Date(a.created);
            });

            alerts.forEach(alert => {
                const card = createPriceAlertCard(alert);
                feed.appendChild(card);
            });
        }

        function createPriceAlertCard(alert) {
            const card = document.createElement('div');
            card.className = 'offer-card';
            card.id = `alert-${alert.id}`;
            
            const currentPrice = parseFloat(alert.current_price || alert.currentPrice || 0);
            const targetPrice = parseFloat(alert.target_price || alert.targetPrice || 0);
            const originalPrice = parseFloat(alert.original_price || alert.originalPrice || currentPrice);
            
            const priceDrop = currentPrice < originalPrice;
            const priceDropPercent = priceDrop ? Math.round((1 - currentPrice / originalPrice) * 100) : 0;
            
            let statusColor = 'var(--text-secondary)';
            let statusText = 'Watching';
            let statusIcon = 'fa-eye';
            
            if (alert.is_notified || alert.notified) {
                statusColor = '#4CAF50';
                statusText = 'Price Drop!';
                statusIcon = 'fa-tag';
            } else if (currentPrice < originalPrice) {
                statusColor = '#ff9800';
                statusText = `Price dropped ${priceDropPercent}%`;
                statusIcon = 'fa-arrow-down';
            }
            
            const offerImage = alert.offer_image || alert.offerImage || 'https://via.placeholder.com/200x150';
            const offerTitle = alert.offer_title || alert.offerTitle || 'Unknown Item';
            const offerId = alert.offer_id || alert.offerId;
            
            card.innerHTML = `
                <div class="card-image" style="position: relative;">
                    <img src="${offerImage}" alt="${offerTitle}" onerror="this.src='https://via.placeholder.com/200x150'">
                    ${(alert.is_notified || alert.notified) ? '<div class="price-drop-badge">🔥 PRICE DROP</div>' : ''}
                </div>
                <div class="card-details">
                    <div>
                        <div class="card-header">
                            <div class="title-price-wrapper">
                                <h3 class="offer-title">${offerTitle}</h3>
                                <span class="offer-price">€${currentPrice.toFixed(2)}</span>
                            </div>
                        </div>
                        
                        <div class="alert-details">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: var(--text-light, #666);">Target Price:</span>
                                <span style="font-weight: bold; color: var(--primary);">€${targetPrice.toFixed(2)}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: var(--text-light, #666);">Original Price:</span>
                                <span style="text-decoration: line-through; color: var(--text-light, #666); opacity: 0.7;">€${originalPrice.toFixed(2)}</span>
                            </div>
                            ${priceDrop ? `
                            <div style="display: flex; justify-content: space-between;">
                                <span style="color: var(--text-light, #666);">Savings:</span>
                                <span style="color: #4CAF50; font-weight: bold;">-€${(originalPrice - currentPrice).toFixed(2)} (${priceDropPercent}%)</span>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="alert-status">
                            <i class="fas ${statusIcon}" style="color: ${statusColor};"></i>
                            <span style="color: ${statusColor}; font-size: 0.9rem;">${statusText}</span>
                        </div>
                    </div>
                    
                    <div class="card-footer" style="margin-top: 15px;">
                        <div style="display: flex; gap: 10px; width: 100%;">
                            <button class="contact-btn" onclick="viewOffer(${offerId})" style="flex: 1;">
                                <i class="fas fa-eye"></i> View
                            </button>
                            <button class="contact-btn" onclick="deleteAlert(${alert.id}, ${offerId})" style="flex: 1; background: #ff4757; color: white; border-color: #ff4757;">
                                <i class="fas fa-trash"></i> Remove
                            </button>
                        </div>
                        ${(alert.is_notified || alert.notified) ? `
                        <button class="contact-btn" onclick="contactSeller(${offerId})" style="width: 100%; margin-top: 10px; background: var(--primary); color: white;">
                            <i class="fas fa-comment"></i> Message Seller
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
            
            return card;
        }

        function setPriceAlert(offerId, offerTitle, offerImage, currentPrice) {
            const user = getCurrent();
            if (!user) {
                showError("Please login to set price alerts.");
                setTimeout(() => window.location.href = 'account.php', 1500);
                return;
            }
            
            const targetPrice = prompt(`Set target price for ${offerTitle} (current: €${currentPrice}):`, (currentPrice * 0.8).toFixed(2));
            
            if (!targetPrice) return;
            
            const targetPriceNum = parseFloat(targetPrice);
            if (isNaN(targetPriceNum) || targetPriceNum <= 0) {
                showError("Please enter a valid price.");
                return;
            }
            
            showError("Setting price alert...");
            
            fetch('api/price-alerts.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    offerId: offerId,
                    offerTitle: offerTitle,
                    offerImage: offerImage,
                    targetPrice: targetPriceNum,
                    currentPrice: currentPrice
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showNotification('Success!', 'Price alert set successfully!', 'success');
                    if (currentTab === 'priceAlerts') {
                        loadPriceAlerts();
                    }
                } else {
                    showError(data.message || "Failed to set price alert");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError("Failed to connect to server");
            });
        }

        function deleteAlert(alertId, offerId) {
            if (!confirm("Remove this price alert?")) return;
            
            fetch('api/price-alerts.php', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    alertId: alertId,
                    offerId: offerId
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    triggeredAlertIds.delete(alertId);
                    
                    const card = document.getElementById(`alert-${alertId}`);
                    if (card) {
                        card.style.transition = 'opacity 0.3s';
                        card.style.opacity = '0';
                        setTimeout(() => {
                            card.remove();
                            if (document.querySelectorAll('[id^="alert-"]').length === 0) {
                                loadPriceAlerts();
                            }
                        }, 300);
                    }
                } else {
                    showError(data.message || "Failed to delete alert");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError("Failed to connect to server");
            });
        }

        function clearAllAlerts() {
            if (!confirm("Clear all your price alerts?")) return;
            
            fetch('api/price-alerts.php', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    clearAll: true
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    triggeredAlertIds.clear();
                    showNotification('Success!', 'All alerts cleared', 'success');
                    loadPriceAlerts();
                } else {
                    const alerts = document.querySelectorAll('[id^="alert-"]');
                    if (alerts.length === 0) return;
                    
                    const deletePromises = [];
                    alerts.forEach(alert => {
                        const alertId = alert.id.replace('alert-', '');
                        deletePromises.push(
                            fetch('api/price-alerts.php', {
                                method: 'DELETE',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({ alertId: alertId })
                            })
                        );
                    });
                    
                    Promise.all(deletePromises)
                        .then(() => {
                            triggeredAlertIds.clear();
                            showNotification('Success!', 'All alerts cleared', 'success');
                            loadPriceAlerts();
                        })
                        .catch(error => {
                            console.error('Error clearing alerts:', error);
                            showError('Failed to clear all alerts');
                        });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showError('Failed to connect to server');
            });
        }

        function viewOffer(offerId) {
            window.location.href = `offer-details.php?id=${offerId}`;
        }

        function contactSeller(offerId) {
            window.location.href = `chats.html`;
        }

        function createOfferCard(offer, isFavorited) {
            const card = document.createElement('div');
            card.className = 'offer-card';
            card.id = `card-${offer.id}`;
            
            card.addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                    return;
                }
                addToRecentlyViewed(offer.id);
            });
            
            let sellerName = offer.seller || "Unknown";
            const sellerAvatarSrc = offer.seller_avatar || offer.sellerAvatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(sellerName)}&background=ff2d7a&color=fff&size=30`;
            let avatarHtml = `<img src="${sellerAvatarSrc}" class="seller-avatar-img" alt="${sellerName}" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(sellerName)}&background=ff2d7a&color=fff&size=30'">`;
            
            let dateText = 'Recently';
            if (offer.date) {
                const date = new Date(offer.date);
                dateText = date.toLocaleDateString();
            }

            const heartIcon = isFavorited ? 'fas' : 'far';
            
            card.innerHTML = `
                <button class="heart-btn ${isFavorited ? 'liked' : ''}" onclick="toggleLike(this, ${offer.id}); event.stopPropagation();">
                    <i class="${heartIcon} fa-heart"></i>
                </button>
                <div class="card-image">
                    <img src="${offer.image || 'https://via.placeholder.com/200x150'}" alt="${offer.title}" onerror="this.src='https://via.placeholder.com/200x150'">
                </div>
                <div class="card-details">
                    <div>
                        <div class="card-header">
                            <div class="title-price-wrapper">
                                <h3 class="offer-title">${offer.title}</h3>
                                <span class="offer-price">€${offer.price}</span>
                            </div>
                        </div>
                        <p class="offer-desc">${offer.description || offer.desc || 'No description'}</p>
                    </div>
                    <div class="card-footer">
                        <div class="seller-info">
                            ${avatarHtml}
                            <span style="margin-left:8px;">${sellerName} • ${dateText}</span>
                        </div>
                        <div style="display: flex; gap: 5px;">
                            <button class="contact-btn" onclick="setPriceAlert(${offer.id}, '${offer.title.replace(/'/g, "\\'")}', '${offer.image || 'https://via.placeholder.com/200x150'}', ${offer.price}); event.stopPropagation();" style="padding: 6px 10px;">
                                <i class="fas fa-bell"></i>
                            </button>
                            <button class="contact-btn" onclick="contactSeller(${offer.id}); event.stopPropagation();">Message</button>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        function toggleLike(btn, offerId) {
            let user = getCurrent();
            
            if (!user) {
                showError("Please login to save favorites.");
                setTimeout(() => window.location.href = 'account.php', 1500);
                return;
            }

            const wasLiked = btn.classList.contains('liked');
            
            if (wasLiked) {
                btn.classList.remove('liked');
                btn.querySelector('i').className = 'far fa-heart';
            } else {
                btn.classList.add('liked');
                btn.querySelector('i').className = 'fas fa-heart';
            }

            btn.disabled = true;

            fetch('api/toggle-favorite.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    offerId: offerId,
                    action: 'toggle'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    if (user) {
                        user.favorites = data.favorites;
                        localStorage.setItem('currentUser', JSON.stringify(user));
                    }
                    if (currentTab === 'favorites') {
                        loadFavorites();
                    }
                } else {
                    if (wasLiked) {
                        btn.classList.add('liked');
                        btn.querySelector('i').className = 'fas fa-heart';
                    } else {
                        btn.classList.remove('liked');
                        btn.querySelector('i').className = 'far fa-heart';
                    }
                    showError(data.message || 'Failed to update favorite');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                if (wasLiked) {
                    btn.classList.add('liked');
                    btn.querySelector('i').className = 'fas fa-heart';
                } else {
                    btn.classList.remove('liked');
                    btn.querySelector('i').className = 'far fa-heart';
                }
                showError('Failed to connect to server');
            })
            .finally(() => {
                btn.disabled = false;
            });
        }

        // --- INIT ---
        window.onload = function() {
            initTheme();
            
            const urlParams = new URLSearchParams(window.location.search);
            const tab = urlParams.get('tab');
            
            if (tab === 'recent') {
                document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
                document.getElementById('tabRecent').classList.add('active');
                currentTab = 'recent';
            } else if (tab === 'priceAlerts') {
                document.querySelectorAll('.category-list li').forEach(li => li.classList.remove('active'));
                document.getElementById('tabPriceAlerts').classList.add('active');
                currentTab = 'priceAlerts';
                autoRefreshInterval = setInterval(checkForPriceDrops, 30000);
            } else {
                document.getElementById('tabFavorites').classList.add('active');
                currentTab = 'favorites';
            }
            
            loadTabContent();
        };

        window.onunload = function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        };

        // Check for error message in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error')) {
            showError(decodeURIComponent(urlParams.get('error')));
            window.history.replaceState({}, document.title, 'favorites.html');
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('campuscycle_theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
    </script>

<!-- Floating theme toggle (matches all other pages) -->
<script>
(function() {
    const THEME_KEY = 'campuscycle_theme';
    const themes = {
        light: { icon: '☀️', label: 'Light Mode' },
        dark: { icon: '🌙', label: 'Dark Mode' },
        'high-contrast': { icon: '◑', label: 'High Contrast' }
    };
    function setTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem(THEME_KEY, theme);
        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === theme);
        });
    }
    function createThemeToggle() {
        if (document.querySelector('.theme-toggle')) return;
        const wrap = document.createElement('div');
        wrap.className = 'theme-toggle';
        Object.keys(themes).forEach(t => {
            const btn = document.createElement('button');
            btn.className = `theme-btn ${t}`;
            btn.dataset.theme = t;
            btn.title = themes[t].label;
            btn.innerHTML = themes[t].icon;
            btn.addEventListener('click', () => setTheme(t));
            wrap.appendChild(btn);
        });
        document.body.appendChild(wrap);
        setTheme(localStorage.getItem(THEME_KEY) || 'light');
    }
    document.readyState === 'loading'
        ? document.addEventListener('DOMContentLoaded', createThemeToggle)
        : createThemeToggle();
})();
</script>
