<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - CampusCycle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <nav>
            <a href="index.html" class="logo">
                <i class="fas fa-bicycle"></i> CampusCycle
            </a>

            <div class="nav-links">
                <a href="favorites.html" class="nav-item" style="color: var(--primary);">
                    <i class="fas fa-heart"></i>
                </a>
                <a href="chats.html" class="nav-item"><i class="far fa-comment-dots"></i></a>
                <a href="account.html" class="nav-item"><i class="far fa-user-circle"></i></a>
                <a href="add-offer.html" class="nav-item btn-add-offer"><i class="fas fa-plus"></i> Add Offer</a>
            </div>
        </nav>
    </header>

    <div class="favorites-header">
        <h2>Saved Offers</h2>
    </div>

    <div class="container">

        <aside>
            <div class="category-list">
                <h3>Your Lists</h3>
                <ul>
                    <li style="background-color: var(--primary-light); color: var(--primary-dark);">
                        <i class="fas fa-heart"></i> All Favorites
                    </li>
                    <li><i class="fas fa-history"></i> Recently Viewed</li>
                    <li><i class="fas fa-bell"></i> Price Alerts</li>
                </ul>
            </div>
        </aside>

        <div class="offers-feed" id="favFeed">
        </div>
    </div>

    <script src="api.js"></script>
    <script src="login.db"></script>
    <script src="offers.db"></script>
    <script>
        // --- HELPERS ---
        function getCurrent() { return API.getCurrentUser(); }
        function saveCurrent(user) { API.setCurrentUser(user); }

        // --- LOAD FAVORITES ---
        window.onload = async function () {
            const user = getCurrent();
            const feed = document.getElementById('favFeed');

            // 1. Check Login
            if (!user) {
                feed.innerHTML = `
                    <div style="text-align:center; padding: 40px;">
                        <h3>Please Login</h3>
                        <p style="color:#666; margin-bottom:20px;">You need to be logged in to see your favorites.</p>
                        <a href="account.html" class="btn-add-offer" style="text-decoration:none;">Go to Login</a>
                    </div>`;
                return;
            }

            // Load data from server
            try {
                await window.OffersDB.refreshOffers();
                await window.LoginDB.refreshUsers();
            } catch (e) { /* use cache if fails */ }

            // Refresh favorites from server
            let favIds;
            try {
                favIds = await API.getFavorites();
                // Update cached user
                user.favorites = favIds;
                saveCurrent(user);
            } catch (e) {
                favIds = user.favorites || [];
            }

            // 2. Check for Favorites
            if (!favIds || favIds.length === 0) {
                feed.innerHTML = '<p style="color:#666;">You haven\'t liked any offers yet.</p>';
                return;
            }

            // 3. Get all offers and Filter
            const allOffers = window.OffersDB.getOffers();
            const usersDB = window.LoginDB.getUsers();

            const myFavs = allOffers.filter(offer => favIds.includes(offer.id));

            // 4. Render
            myFavs.forEach(offer => {

                let sellerName = offer.seller || "Unknown";
                let avatarHtml = `<div class="seller-avatar">${sellerName.substring(0, 2).toUpperCase()}</div>`;

                if (offer.sellerUsername) {
                    const sellerObj = usersDB.find(u => u.username === offer.sellerUsername);
                    if (sellerObj) {
                        sellerName = sellerObj.profile.name || sellerObj.username;
                        if (sellerObj.profile.avatar && sellerObj.profile.avatar.length > 50) {
                            avatarHtml = `<img src="${sellerObj.profile.avatar}" style="width:30px; height:30px; border-radius:50%; object-fit:cover;">`;
                        }
                    }
                }

                const html = `
                    <div class="offer-card" id="card-${offer.id}">
                        <button class="heart-btn liked" onclick="removeFavorite(this, ${offer.id})">
                            <i class="fas fa-heart"></i>
                        </button>
                        <div class="card-image">
                            <img src="${offer.image}" alt="${offer.title}">
                        </div>
                        <div class="card-details">
                            <div class="card-header">
                                <div class="offer-title">${offer.title}</div>
                                <div class="offer-price">€${offer.price}</div>
                            </div>
                            <p class="offer-desc">${offer.desc}</p>
                            <div class="card-footer">
                                <div class="seller-info">
                                    ${avatarHtml}
                                    <span style="margin-left:8px;">${sellerName} • ${offer.time}</span>
                                </div>
                                <button class="contact-btn" onclick="startChat('${offer.id}')">Message</button>
                            </div>
                        </div>
                    </div>
                `;
                feed.insertAdjacentHTML('beforeend', html);
            });
        };

        // --- REMOVE FAVORITE ---
        async function removeFavorite(btn, id) {
            let user = getCurrent();
            if (!user) return;

            try {
                await API.removeFavorite(id);
            } catch (e) {
                alert('Failed to remove favorite.');
                return;
            }

            // VISUAL: Remove the card from the screen immediately
            const card = document.getElementById(`card-${id}`);
            if (card) {
                card.style.opacity = '0';
                setTimeout(() => card.remove(), 300);

                // Refresh user cache
                user = getCurrent(); // re-read after API updated it
                if (!user.favorites || user.favorites.length === 0) {
                    document.getElementById('favFeed').innerHTML = '<p style="color:#666;">You haven\'t liked any offers yet.</p>';
                }
            }
        }

        // --- START CHAT FROM FAVORITES ---
        async function startChat(offerId) {
            const user = getCurrent();
            if (!user) {
                alert("Please login to send messages.");
                window.location.href = 'account.html';
                return;
            }

            const offers = window.OffersDB.getOffers();
            const offer = offers.find(o => o.id == offerId);
            if (!offer) return;

            if (offer.sellerUsername === user.username) {
                alert("You cannot message yourself.");
                return;
            }

            try {
                let sellerAvatar = '';
                const users = window.LoginDB.getUsers();
                if (offer.sellerUsername) {
                    const sellerObj = users.find(u => u.username === offer.sellerUsername);
                    if (sellerObj && sellerObj.profile && sellerObj.profile.avatar) {
                        sellerAvatar = sellerObj.profile.avatar;
                    }
                }

                const result = await API.createChat({
                    offerId: String(offerId),
                    sellerUsername: offer.sellerUsername || 'Unknown',
                    sellerName: offer.seller || 'Unknown',
                    sellerAvatar: sellerAvatar,
                    offerTitle: offer.title,
                    offerImage: offer.image
                });

                if (result.success) {
                    window.location.href = `chats.html?chatId=${result.chatId}`;
                }
            } catch (e) {
                alert('Failed to start chat. Please try again.');
            }
        }
    </script>
</body>

</html>
