<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - CampusCycle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo"><i class="fas fa-bicycle"></i> CampusCycle</a>
            <div class="nav-links">
                <a href="favorites.html" class="nav-item"><i class="far fa-heart"></i></a>
                <a href="#" class="nav-item"><i class="far fa-comment-dots"></i></a>
                <a href="account.html" class="nav-item" style="color: var(--primary);"><i class="fas fa-user-circle"></i></a>
                <a href="add-offer.html" class="nav-item btn-add-offer"><i class="fas fa-plus"></i> Add Offer</a>
            </div>
        </nav>
    </header>

    <div class="container">
        
        <div id="authSection" class="auth-wrapper">
            <div style="display:flex; margin-bottom: 20px; border-bottom: 1px solid #eee;">
                <button class="sidebar-btn active" id="tabLogin" onclick="toggleAuth('login')" style="text-align:center;">Login</button>
                <button class="sidebar-btn" id="tabRegister" onclick="toggleAuth('register')" style="text-align:center;">Register</button>
            </div>

            <form id="loginForm">
                <div class="error-msg" id="loginError">Invalid credentials.</div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUser" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPass" class="form-control" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePass('loginPass', this)"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <form id="registerForm" class="hidden">
                <div class="error-msg" id="regError">Error message.</div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="regUser" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Confirm Username</label>
                    <input type="text" id="regUserConfirm" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPass" class="form-control" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePass('regPass', this)"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="regPassConfirm" class="form-control" required>
                        <i class="fas fa-eye toggle-password" onclick="togglePass('regPassConfirm', this)"></i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">Create Account</button>
            </form>
        </div>

        <div id="profileSection" class="account-layout hidden">
            
            <aside class="account-sidebar">
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="" id="sidebarAvatar" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover;">
                    <h4 id="sidebarName" style="margin-top: 10px;">User</h4>
                </div>
                <button class="sidebar-btn active" onclick="showSection('details', this)">
                    <i class="fas fa-user-cog"></i> Account Details
                </button>
                <button class="sidebar-btn" onclick="showSection('posts', this)">
                    <i class="fas fa-layer-group"></i> My Posts
                </button>
                <div class="divider"></div>
                <button class="sidebar-btn" onclick="logout()" style="color: #ff4757;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </aside>

            <main class="account-content">
                
                <div id="detailsView">
                    <h2>Edit Profile</h2>
                    <br>
                    <form id="profileForm">
                        <div class="profile-pic-container" onclick="document.getElementById('avatarInput').click()">
                            <img src="" id="mainAvatar" class="profile-pic">
                            <div class="profile-pic-overlay"><i class="fas fa-camera"></i></div>
                            <input type="file" id="avatarInput" hidden accept="image/png, image/jpeg, image/jpg" onchange="previewAvatar(this)">
                        </div>
                        
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="profName" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="profEmail" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="profPhone" class="form-control">
                        </div>
                        <button type="submit" class="submit-btn">Save Info</button>
                    </form>

                    <div class="divider"></div>

                    <h3>Change Password</h3>
                    <br>
                    <form id="passwordForm">
                        <div class="error-msg" id="passMsg"></div>
                        <div class="form-group">
                            <label>Old Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="oldPass" class="form-control" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePass('oldPass', this)"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="newPass" class="form-control" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePass('newPass', this)"></i>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <div class="password-wrapper">
                                <input type="password" id="newPassConf" class="form-control" required>
                                <i class="fas fa-eye toggle-password" onclick="togglePass('newPassConf', this)"></i>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn" style="background-color: #333;">Update Password</button>
                    </form>
                </div>

                <div id="postsView" class="hidden">
                    <h2>My Active Offers</h2>
                    <br>
                    <div id="myPostsList">
                        </div>
                </div>

            </main>
        </div>
    </div>

    <div class="modal-overlay" id="alertModal">
        <div class="modal-box">
            <h3 id="modalTitle">Alert</h3>
            <p id="modalMsg">Message</p>
            <button class="submit-btn" onclick="document.getElementById('alertModal').style.display='none'">OK</button>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-box" style="text-align: left;">
            <h3>Edit Offer</h3>
            <br>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="editTitle" class="form-control">
            </div>
            <div class="form-group">
                <label>Price (€)</label>
                <input type="number" id="editPrice" class="form-control">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="submit-btn" onclick="saveEdit()">Save</button>
                <button class="submit-btn" style="background: #ccc;" onclick="document.getElementById('editModal').style.display='none'">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // --- AUTH TOGGLE ---
        function toggleAuth(view) {
            if(view === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('tabRegister').classList.add('active');
            }
        }

        // --- PASSWORD VISIBILITY ---
        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if(input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = "password";
                icon.classList.add('fa-eye');
                icon.classList.remove('fa-eye-slash');
            }
        }

        // --- GLOBAL DATA HELPERS ---
        function getUsers() { return JSON.parse(localStorage.getItem('campusUsers')) || []; }
        function saveUsers(users) { localStorage.setItem('campusUsers', JSON.stringify(users)); }
        function getCurrent() { return JSON.parse(localStorage.getItem('currentUser')); }
        function saveCurrent(user) { localStorage.setItem('currentUser', JSON.stringify(user)); }
        function getOffers() { return JSON.parse(localStorage.getItem('campusOffers')) || []; }
        function saveOffers(offers) { localStorage.setItem('campusOffers', JSON.stringify(offers)); }

        // --- REGISTER ---
        document.getElementById('registerForm').addEventListener('submit', e => {
            e.preventDefault();
            const user = document.getElementById('regUser').value;
            const userConf = document.getElementById('regUserConfirm').value;
            const pass = document.getElementById('regPass').value;
            const passConf = document.getElementById('regPassConfirm').value;
            const err = document.getElementById('regError');

            if(user !== userConf) return showErr(err, "Usernames do not match");
            if(pass !== passConf) return showErr(err, "Passwords do not match");

            let users = getUsers();
            if(users.find(u => u.username === user)) return showErr(err, "Username taken");

            // Create User (Default avatar is a placeholder)
            users.push({ username: user, password: pass, profile: { avatar: 'https://via.placeholder.com/150' } });
            saveUsers(users);
            
            alert('Registered! Please login.');
            toggleAuth('login');
            e.target.reset();
        });

        // --- LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', e => {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            
            const found = getUsers().find(u => u.username === user && u.password === pass);
            if(found) {
                saveCurrent(found);
                checkSession();
            } else {
                showErr(document.getElementById('loginError'), "Invalid credentials");
            }
        });

        // --- LOGOUT ---
        function logout() {
            localStorage.removeItem('currentUser');
            location.reload();
        }

        // --- CHECK SESSION & LOAD UI ---
        function checkSession() {
            const user = getCurrent();
            if(user) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('profileSection').classList.remove('hidden');
                
                // Load Profile Data
                document.getElementById('sidebarName').innerText = user.profile.name || user.username;
                document.getElementById('sidebarAvatar').src = user.profile.avatar;
                document.getElementById('mainAvatar').src = user.profile.avatar;
                
                document.getElementById('profName').value = user.profile.name || '';
                document.getElementById('profEmail').value = user.profile.email || '';
                document.getElementById('profPhone').value = user.profile.phone || '';

                loadMyPosts();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('profileSection').classList.add('hidden');
            }
        }

        // --- PROFILE TABS ---
        function showSection(section, btn) {
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            if(section === 'details') {
                document.getElementById('detailsView').classList.remove('hidden');
                document.getElementById('postsView').classList.add('hidden');
            } else {
                document.getElementById('detailsView').classList.add('hidden');
                document.getElementById('postsView').classList.remove('hidden');
                loadMyPosts();
            }
        }

        // --- UPDATE PROFILE ---
        document.getElementById('profileForm').addEventListener('submit', e => {
            e.preventDefault();
            let user = getCurrent();
            let users = getUsers();

            user.profile.name = document.getElementById('profName').value;
            user.profile.email = document.getElementById('profEmail').value;
            user.profile.phone = document.getElementById('profPhone').value;
            user.profile.avatar = document.getElementById('mainAvatar').src;

            // Update in Users Array
            const idx = users.findIndex(u => u.username === user.username);
            users[idx] = user;
            
            saveUsers(users);
            saveCurrent(user);
            
            alert('Profile Saved');
            checkSession(); // Refresh sidebars
        });

        function previewAvatar(input) {
            if(input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('mainAvatar').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- CHANGE PASSWORD ---
        document.getElementById('passwordForm').addEventListener('submit', e => {
            e.preventDefault();
            let user = getCurrent();
            let users = getUsers();
            const oldP = document.getElementById('oldPass').value;
            const newP = document.getElementById('newPass').value;
            const confP = document.getElementById('newPassConf').value;
            const msg = document.getElementById('passMsg');

            if(user.password !== oldP) return showErr(msg, "Incorrect old password");
            if(newP !== confP) return showErr(msg, "New passwords do not match");

            user.password = newP;
            const idx = users.findIndex(u => u.username === user.username);
            users[idx] = user;

            saveUsers(users);
            saveCurrent(user);
            alert('Password changed successfully');
            e.target.reset();
        });

        // --- MY POSTS LOGIC ---
        function loadMyPosts() {
            const user = getCurrent();
            const offers = getOffers();
            const container = document.getElementById('myPostsList');
            container.innerHTML = '';

            // Filter offers where seller name matches user's name
            // Note: In add-offer we used to save 'You', now we should save username.
            // We will match based on 'sellerUsername' if available, or 'seller' text
            const myOffers = offers.filter(o => o.sellerUsername === user.username);

            if(myOffers.length === 0) {
                container.innerHTML = '<p style="color:#666; text-align:center;">You have not posted any offers.</p>';
                return;
            }

            myOffers.forEach(offer => {
                const div = document.createElement('div');
                div.className = 'my-post-item';
                div.innerHTML = `
                    <img src="${offer.image}" class="my-post-img">
                    <div class="my-post-info">
                        <h4>${offer.title}</h4>
                        <p style="color: var(--primary); font-weight:bold;">€${offer.price}</p>
                    </div>
                    <div class="my-post-actions">
                        <button class="action-btn btn-edit" onclick="openEdit(${offer.id})">Edit</button>
                        <button class="action-btn btn-delete" onclick="deletePost(${offer.id})">Delete</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function deletePost(id) {
            if(confirm('Are you sure you want to delete this offer?')) {
                let offers = getOffers();
                offers = offers.filter(o => o.id !== id);
                saveOffers(offers);
                loadMyPosts();
            }
        }

        function openEdit(id) {
            const offers = getOffers();
            const offer = offers.find(o => o.id === id);
            if(offer) {
                document.getElementById('editId').value = offer.id;
                document.getElementById('editTitle').value = offer.title;
                document.getElementById('editPrice').value = offer.price;
                document.getElementById('editModal').style.display = 'flex';
            }
        }

        function saveEdit() {
            const id = parseInt(document.getElementById('editId').value);
            let offers = getOffers();
            const idx = offers.findIndex(o => o.id === id);
            
            if(idx > -1) {
                offers[idx].title = document.getElementById('editTitle').value;
                offers[idx].price = document.getElementById('editPrice').value;
                saveOffers(offers);
                document.getElementById('editModal').style.display = 'none';
                loadMyPosts();
            }
        }

        function showErr(el, msg) {
            el.innerText = msg;
            el.style.display = 'block';
        }

        checkSession();
    </script>
</body>
</html>
